# nginx config for the SvelteKit static build.
#
# Three things this gets right that the default config doesn't:
#   1. WASM files served with the right MIME type (some browsers refuse
#      streaming compilation otherwise — silent failure on first load).
#   2. SPA fallback so client-side routes don't 404 on refresh.
#   3. Aggressive cache headers on the SvelteKit asset bundle, which is
#      content-hashed and safe to cache forever.

server {
    listen      80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Nginx 1.27's mime.types natively includes application/wasm,
    # so we just include the default list.
    include /etc/nginx/mime.types;

    # Security headers that don't break a static SPA.
    add_header X-Content-Type-Options "nosniff"          always;
    add_header X-Frame-Options        "SAMEORIGIN"       always;
    add_header Referrer-Policy        "no-referrer"      always;

    # Content-Security-Policy. 'wasm-unsafe-eval' is required for streaming
    # WebAssembly compilation; everything else stays self-only. Svelte
    # injects scoped <style> blocks at runtime, so 'unsafe-inline' on
    # style-src is unavoidable without server-side templating.
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;

    # Compression. Brotli isn't compiled into nginx:alpine by default, so
    # gzip is what we have. Skip already-compressed types.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # SvelteKit's hashed assets live under _app/. They're content-addressed,
    # so cache them forever.
    location /_app/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # The wasm bundle from wasm-pack lives under /lib/wasm/ in dev, but
    # SvelteKit's build pipeline rewrites those imports into /_app/, so
    # this rule is mostly belt-and-suspenders for direct fetches.
    location ~* \.(wasm|js|css)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any unknown path serves index.html so the client router
    # can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't log health-check noise.
    location = /healthz {
        access_log off;
        return     200 "ok\n";
        add_header Content-Type "text/plain";
    }
}
