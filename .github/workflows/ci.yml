# CI for construction-calc.
#
# Jobs:
#   1. engine    — fmt, clippy, test the Rust engine
#   2. wasm      — verify the wasm-pack build succeeds
#   3. frontend  — typecheck and build the SvelteKit app (uses wasm output)
#   4. docker    — build the runtime image (catches Dockerfile/path drift)
#
# The toolchain comes from rust-toolchain.toml so it's a single source of
# truth — bump there and CI follows.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  engine:
    name: Engine (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        # Pulls the version from rust-toolchain.toml automatically.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p calc-core --all-features

  wasm:
    name: Build WASM bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - run: wasm-pack build crates/calc-wasm --release --target web --out-dir wasm-out
      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-bundle
          path: crates/calc-wasm/wasm-out/

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Download wasm bundle
        uses: actions/download-artifact@v4
        with:
          name: wasm-bundle
          path: frontend/src/lib/wasm

      - name: Install deps
        working-directory: frontend
        # Use ci when lockfile present, fall back to install for first build.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck
        working-directory: frontend
        run: npx svelte-kit sync && npx svelte-check --tsconfig ./tsconfig.json

      - name: Build
        working-directory: frontend
        # Skip build:wasm — we restored a pre-built bundle from the artifact.
        run: npx vite build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: construction-calc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
