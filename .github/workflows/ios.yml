# iOS → TestFlight, fully from CI (no Mac required to operate).
#
# Runs on a macOS runner (the only place Xcode exists). It builds the Rust engine
# into CalcEngine.xcframework, generates the Xcode project with XcodeGen, signs with
# a distribution cert + provisioning profile from secrets, and uploads the build to
# TestFlight via an App Store Connect API key.
#
# Trigger: manual (Actions → "iOS TestFlight" → Run) or by pushing a tag `ios-v*`.
#
# Required repository secrets (see docs/IOS-TESTFLIGHT.md for how to create each
# WITHOUT a Mac):
#   BUILD_CERTIFICATE_BASE64        base64 of the Apple Distribution cert (.p12)
#   P12_PASSWORD                    password used when exporting that .p12
#   BUILD_PROVISION_PROFILE_BASE64  base64 of the App Store provisioning profile
#   PROVISIONING_PROFILE_NAME       the profile's name in the Developer portal
#   KEYCHAIN_PASSWORD               any throwaway string (temp keychain)
#   APPLE_TEAM_ID                   your 10-char Apple Developer Team ID
#   ASC_KEY_ID                      App Store Connect API key ID
#   ASC_ISSUER_ID                   App Store Connect API issuer ID
#   ASC_KEY_CONTENT                 base64 of the API key (.p8)

name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags: ["ios-v*"]

permissions:
  contents: read

jobs:
  testflight:
    name: Build & upload to TestFlight
    # macOS 26 image → Xcode 26 / iOS 26 SDK, which App Store Connect now requires.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (iOS 26 SDK)
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build CalcEngine.xcframework (Rust → iOS)
        # Installs the iOS Rust targets, builds the slices, generates the Swift
        # bindings, and assembles ios/CalcEngine.xcframework.
        run: bash scripts/build-ios.sh

      - name: Install signing certificate + provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Generate the Xcode project
        working-directory: ios
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: xcodegen generate

      - name: Build & upload to TestFlight
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
          BUILD_NUMBER: ${{ github.run_number }}
          # Point fastlane/gym at the temp keychain we just populated.
          FASTLANE_KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
        run: |
          # Decode the App Store Connect API key to a real .p8 file. fastlane's altool
          # upload path doesn't base64-decode key_content itself (#30066), so we hand
          # it a decoded file via key_filepath instead.
          echo -n "$ASC_KEY_CONTENT" | base64 --decode -o "$RUNNER_TEMP/asc_api_key.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/asc_api_key.p8"
          head -1 "$ASC_KEY_PATH" | grep -q "BEGIN PRIVATE KEY" || { echo "decoded .p8 looks wrong"; exit 1; }
          fastlane beta

      - name: Upload build artifacts (.ipa + logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            ios/build/*.ipa
            ~/Library/Logs/gym/*.log
          if-no-files-found: ignore

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
