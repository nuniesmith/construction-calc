[workspace]
resolver = "2"
members = [
    "crates/calc-core",
    "crates/calc-wasm",
    "crates/calc-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["nuniesmith <nuniesmith@github>"]
license = "MIT"
rust-version = "1.94.1"
repository = "https://github.com/nuniesmith/construction-calc"

[workspace.dependencies]
num-rational = { version = "0.4", default-features = false, features = ["num-bigint"] }
num-integer = { version = "0.1", default-features = false }
num-traits = { version = "0.2", default-features = false }
thiserror = "2.0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true

[profile.release-wasm]
inherits = "release"
opt-level = "z"
