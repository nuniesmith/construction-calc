# Production compose. Bind to loopback only — external access is
# expected to come via Tailscale, matching the FKS infrastructure
# convention. Change the host port if 8080 collides on Sullivan/Freddy.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: construction-calc:latest
    container_name: construction-calc
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/healthz",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # nginx is happy with 64MB; cap it so a runaway can't eat the host.
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    # Read-only rootfs: nginx only needs to write to /var/cache/nginx
    # and /var/run, which we surface as tmpfs.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
