# Production compose. Bind to a single interface — by default loopback,
# but on Tailnet hosts (Sullivan/Freddy/desktop) set HOST_BIND to the
# machine's Tailscale IP in a local .env so it's reachable as
# `<machine>:<port>` from other tailnet peers and nothing else.
#
#   HOST_BIND  -- interface address to listen on (default 127.0.0.1)
#   HOST_PORT  -- host port to publish        (default 8099; 8080 often
#                 collides with qBittorrent / other dev services)
#
# See .env.example for the recommended layout.

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: construction-calc:latest
    container_name: construction-calc
    restart: unless-stopped
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8099}:80"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://localhost/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
