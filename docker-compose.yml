# Production compose. Bind to loopback only — external access is
# expected to come via Tailscale, matching the FKS infrastructure
# convention. Change the host port if 8080 collides on Sullivan/Freddy.

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: construction-calc:latest
    container_name: construction-calc
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://localhost/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
