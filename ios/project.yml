# XcodeGen spec — generates ConstructionCalc.xcodeproj from config so the iOS app
# builds HEADLESSLY (no manual "New → App" GUI step), which is what makes the
# no-Mac CI → TestFlight pipeline possible. Regenerate with `xcodegen generate`
# (run from this `ios/` dir) AFTER `scripts/build-ios.sh` has produced the
# xcframework + the generated CalcEngine.swift binding.
#
# Integration: a `CalcEngine` framework target compiles the generated
# `Sources/CalcEngine/CalcEngine.swift` and statically links
# `CalcEngine.xcframework` (which carries the `CalcEngineFFI` C module + the Rust
# `libcalc_uniffi.a`). It exposes the `CalcEngine` Swift module that the app
# sources already `import`. The app target embeds & signs that framework.
#
# If the framework-module route hits a snag on the first macOS shakedown, the
# fallback is a single app target that compiles CalcEngine.swift directly and drops
# the `import CalcEngine` lines (see docs/IOS-TESTFLIGHT.md → Troubleshooting).

name: ConstructionCalc

options:
  bundleIdPrefix: com.nuniesmith
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    # Build number — overridden per-build by CI so each upload is unique.
    CURRENT_PROJECT_VERSION: "1"
    # Signing is injected by CI (empty locally → use Xcode automatic signing).
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"

targets:
  # Thin Swift module over the Rust engine.
  CalcEngine:
    type: framework
    platform: iOS
    sources:
      # Generated by scripts/build-ios.sh (gitignored). Must exist before xcodegen.
      - path: Sources/CalcEngine
    dependencies:
      # Static-lib xcframework (libcalc_uniffi.a + the CalcEngineFFI module) — LINK
      # only; its objects are pulled into this framework's binary.
      - framework: CalcEngine.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nuniesmith.constructioncalc.CalcEngine
        DEFINES_MODULE: "YES"

  ConstructionCalc:
    type: application
    platform: iOS
    sources:
      - path: ConstructionCalc
    dependencies:
      - target: CalcEngine
        embed: true # Embed & Sign the dynamic framework into the app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nuniesmith.constructioncalc
        PRODUCT_NAME: ConstructionCalc
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone + iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: "Construction Calc"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # CI sets these for the manual App Store archive; harmless for simulator builds.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "${PROVISIONING_PROFILE_NAME}"
